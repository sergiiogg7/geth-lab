# Docker variant of the Prometheus config (targets host.docker.internal). The native variant (scripts/observability-up.sh) is generated from
# this file family and was verified against Prometheus 3.16.0 (docs/OBSERVABILITY.md); this Docker path itself is UNTESTED (no Docker here).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: geth
    metrics_path: /debug/metrics/prometheus   # geth's exposition path (scripts/start-node.sh: --metrics.port 6060)
    static_configs:
      # host.docker.internal reaches the host from Docker Desktop; on Linux use the host IP
      # or `network_mode: host` and 127.0.0.1.
      - targets: ["host.docker.internal:6060"]
        labels:
          instance: dev-node
