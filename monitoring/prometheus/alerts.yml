# Alert rules for a geth node. Metric names come from a real scrape (docs/METRICS.md).
# Verified natively against Prometheus 3.16.0 (scripts/observability-up.sh, promtool check rules, obscheck);
# GethDown was driven through pending -> firing by stopping the node (docs/OBSERVABILITY.md).
# Each alert maps to a section of docs/RUNBOOK.md.
groups:
  - name: geth
    rules:
      - alert: GethDown
        expr: up{job="geth"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "geth metrics endpoint is down"
          runbook: "docs/RUNBOOK.md#alert-gethdown"

      - alert: NoNewBlocks
        # Only meaningful with --dev.period N (a dev node without a period only seals blocks when a tx arrives).
        expr: changes(chain_head_block[2m]) == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "head block did not move for 2 minutes"
          runbook: "docs/RUNBOOK.md#alert-nonewblocks"

      - alert: HeadWentBackwards
        # The signature of the C1 wedge, measured: after kill -9 of a persistent dev node chain_head_block fell from 13 to 1
        # (docs/evidence/alert-c1-wedge.txt). Also fires on purpose-made rewinds (debug_setHead, lab_fork).
        expr: chain_head_block - max_over_time(chain_head_block[5m]) < 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "block head is lower than it was within the last 5 minutes (rewind)"
          runbook: "docs/RUNBOOK.md#alert-headwentbackwards"

      - alert: HeadStateBehindHeader
        # Header head ahead of the block head: seen during snap sync. It did NOT fire in the C1 wedge: the measured
        # chain_head_header fell together with chain_head_block (docs/evidence/alert-c1-wedge.txt).
        expr: chain_head_header - chain_head_block > 3
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "header head is ahead of the block head by more than 3"
          runbook: "docs/RUNBOOK.md#alert-headstatebehindheader"

      - alert: TxPoolBacklog
        # default --txpool.globalslots is 5120
        expr: txpool_pending > 4000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "more than 4000 executable transactions waiting"
          runbook: "docs/RUNBOOK.md#alert-txpoolbacklog"

      - alert: TxPoolDroppingTransactions
        # txpool_underpriced / txpool_overflowed only ever increase even though geth types them "gauge".
        expr: increase(txpool_underpriced[5m]) > 0 or increase(txpool_overflowed[5m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "pool is discarding transactions (see C3 postmortem: accepted txs can vanish silently)"
          runbook: "docs/RUNBOOK.md#alert-txpooldroppingtransactions"

      - alert: TxPoolTrackerBacklog
        # C3 root cause: RPC-submitted txs the pool refused are held by the local tracker and retried once a minute.
        # txpool_local counts tracked txs; the pool holds pending + queued. A big gap = clients were told "accepted" but the pool has not got them.
        expr: txpool_local - (txpool_pending + txpool_queued) > 100
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "more than 100 accepted transactions are waiting in the local tracker, not in the pool (C3)"
          runbook: "docs/RUNBOOK.md#alert-txpooltrackerbacklog"

      - alert: ChainReorg
        expr: increase(chain_reorg_drop[10m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "blocks were dropped from the canonical chain"
          runbook: "docs/RUNBOOK.md#alert-chainreorg"

      - alert: RpcErrorRatioHigh
        expr: rate(rpc_failure[5m]) / clamp_min(rate(rpc_requests[5m]), 1e-9) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "more than 10% of JSON-RPC requests fail"
          runbook: "docs/RUNBOOK.md#alert-rpcerrorratiohigh"

      - alert: MemoryHigh
        expr: system_memory_used > 2e9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "geth process uses more than 2 GB"
          runbook: "docs/RUNBOOK.md#alert-memoryhigh"

      - alert: NoPeers
        # A --dev node has no networking, so the rule would sit in "pending" forever there (seen in the native run).
        # Instances whose label starts with "dev-" (see prometheus.yml) are excluded; real-network nodes are not.
        expr: p2p_peers{instance!~"dev-.*"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "no peers"
          runbook: "docs/RUNBOOK.md#alert-nopeers"
