name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: vet (build-tagged tests)
        run: go vet -tags "e2e chaos" ./test/...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal test)"
      - name: build
        run: go build -p 2 -o bin/ ./cmd/...
      - name: unit tests (fast, no node needed)
        run: go test -count=1 ./...

  e2e:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: end-to-end test (starts labnode)
        run: go test -tags e2e -count=1 -v -timeout 10m ./test/e2e

